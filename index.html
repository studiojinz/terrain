{"id":"ivanpah","name":"Ivanpah Solar Complex, USA","region":"California–Nevada border, USA","category":"HUMAN SYSTEMS","coords":[35.594785665487265,-115.39215087890626],"bounds":[[35.48249676861339,-115.55785961321874],[35.70707456236114,-115.22644214459379]],"clue":"Find a desert landscape transformed into a large-scale energy system.","story":"Ivanpah uses thousands of sun-tracking mirrors to concentrate sunlight onto three central towers. The heat produces steam that drives turbines, generating up to 392 megawatts of electricity.","hint":"Look for enormous circular fields of mirrors arranged around several central towers."},
{id:"kinderdijk",name:"Dutch Polder Landscape",region:"South Holland, Netherlands",category:"WATER",coords:[51.88,4.64],bounds:[[51.80,4.52],[51.95,4.78]],clue:"Find a landscape shaped by humans keeping water out.",story:"The low-lying Netherlands contains a dense network of canals, dikes and managed fields. From above, straight water channels and organized parcels are the signature.",hint:"Look for a grid of water, fields and narrow roads in very flat terrain."},
{id:"jiangsu",name:"Jiangsu Aquaculture Landscape, China",region:"Jiangsu, China",category:"FOOD",coords:[31.28,120.70],bounds:[[31.16,120.55],[31.39,120.88]],clue:"Look for a landscape where water is part of the food system.",story:"Lowland parts of eastern China contain dense mosaics of ponds, canals and agricultural plots. Repeating water-filled rectangles reveal aquaculture and water-managed farming.",hint:"Look for many small repeating blue or dark rectangles connected by canals."},
{id:"salar",name:"Salar de Atacama, Chile",region:"Antofagasta, Chile",category:"MINERALS",coords:[-23.48,-68.33],bounds:[[-23.60,-68.50],[-23.35,-68.15]],clue:"Find a place where a vast salt landscape meets industrial extraction.",story:"The Salar de Atacama is a major salt-flat landscape with industrial brine operations. Its stark geometry and extreme aridity make the site legible from above.",hint:"Look for huge pale salt surfaces interrupted by sharply geometric evaporation areas."},
{id:"mikkabi",name:"Mikkabi, Japan",region:"Shizuoka, Japan",category:"LAND USE",coords:[34.79,137.58],bounds:[[34.72,137.49],[34.87,137.69]],clue:"Read a Japanese agricultural landscape from above.",story:"The hills and orchards around western Shizuoka form a complex patchwork of agriculture, roads, homes and wooded slopes.",hint:"Look for a dense rural mosaic of orchards, wooded hills and small settlements."},
{id:"reef",name:"Great Barrier Reef, Australia",region:"Queensland, Australia",category:"NATURE",coords:[-18.20,147.70],bounds:[[-18.36,147.48],[-18.02,147.94]],clue:"Find a landscape where the shape of an ecosystem is visible from above.",story:"Coral reefs can create striking patterns in shallow tropical water. Distinguish reef structure from ordinary coastline and sand.",hint:"Look for pale reef forms and turquoise shallow water far offshore."},
{id:"kaz",name:"Central Asian Wind Farm",region:"Kazakhstan",category:"ENERGY",coords:[50.36,72.75],bounds:[[50.23,72.55],[50.49,72.96]],clue:"Find a renewable-energy landscape in a wide-open steppe.",story:"Wind farms are unusually readable from satellite imagery because turbines and access roads repeat in large-scale patterns across open land.",hint:"Look for rows or clusters of repeated infrastructure with long access roads."},
{id:"mekong",name:"Mekong Delta, Vietnam",region:"Mekong Delta, Vietnam",category:"WATER / NATURE",coords:[9.57,105.88],bounds:[[9.45,105.70],[9.70,106.08]],clue:"Find a landscape where rivers, farms and wetlands interlock.",story:"The Mekong Delta is a highly connected water-and-food landscape. Channels, ponds, fields and settlements form a dense pattern visible from space.",hint:"Look for branching waterways mixed with rectangular fields and settlements."},
{id:"dubai",name:"Palm Jumeirah, UAE",region:"Dubai, United Arab Emirates",category:"COAST",coords:[25.112,55.139],bounds:[[25.02,55.04],[25.20,55.25]],clue:"Identify a coastline dramatically reshaped by human engineering.",story:"Artificial islands can be unusually easy to recognize from orbit because their geometry is imposed rather than naturally formed.",hint:"Look for a highly regular coastal form surrounded by open water."},
{id:"everglades",name:"Everglades, USA",region:"Florida, USA",category:"NATURE",coords:[25.30,-80.75],bounds:[[25.16,-80.92],[25.46,-80.56]],clue:"Find a vast wetland whose texture matters more than landmarks.",story:"The Everglades are a huge wetland system whose shallow-water patterns, vegetation and channels create a distinctive texture from above.",hint:"Look for a broad flat wetland mosaic rather than dense urban development."},
{id:"korea",name:"Coastal Reclamation, South Korea",region:"Yellow Sea coast, South Korea",category:"COAST",coords:[37.35,126.55],bounds:[[37.24,126.38],[37.47,126.75]],clue:"Find a coastline where the boundary between land and sea has been engineered.",story:"Large reclamation projects can create straight embankments, enclosed water bodies and new parcels of land along naturally irregular coasts.",hint:"Look for straight coastal boundaries cutting across tidal flats."},

{id:"pivot-kansas",name:"Center-Pivot Farmland, USA",region:"Western Kansas, USA",category:"FOOD",coords:[38.0,-100.9],bounds:[[37.85,-101.15],[38.15,-100.65]],clue:"Find a landscape where irrigation has drawn perfect circles on the land.",story:"Center-pivot irrigation systems rotate around a fixed well, painting huge green or brown circles across the American Great Plains.",hint:"Look for a tiled grid of near-perfect circles across flat cropland."},
{id:"palm-oil",name:"Oil Palm Plantations, Borneo",region:"Kalimantan, Indonesia",category:"LAND USE",coords:[-1.5,110.5],bounds:[[-1.68,110.30],[-1.32,110.72]],clue:"Find a landscape where a single crop has replaced the rainforest in a repeating pattern.",story:"Industrial oil palm plantations create dense, uniform rows of identical tree crowns that stand in sharp contrast to the irregular texture of surrounding rainforest.",hint:"Look for a rigid dotted-row texture that differs from the ragged canopy of natural forest."},
{id:"pilbara",name:"Pilbara Iron Ore Mines, Australia",region:"Western Australia, Australia",category:"MINERALS",coords:[-22.68,118.60],bounds:[[-22.85,118.35],[-22.50,118.85]],clue:"Find a landscape stripped and terraced for what lies beneath it.",story:"The Pilbara's iron ore mines carve deep red-brown terraces and haul roads into the landscape, visible against the surrounding red desert.",hint:"Look for stepped red-brown terraces and straight haul roads cutting into desert terrain."},
{id:"po-delta",name:"Po River Delta, Italy",region:"Veneto, Italy",category:"WATER / NATURE",coords:[44.92,12.35],bounds:[[44.80,12.15],[45.05,12.60]],clue:"Find a landscape where a river dissolves into a maze of channels and lagoons before reaching the sea.",story:"The Po Delta splits into a fine network of distributary channels, reclaimed farmland and coastal lagoons as it meets the Adriatic.",hint:"Look for a branching river mouth surrounded by lagoons and reclaimed rectangular fields."},
{id:"burning-man",name:"Black Rock Desert Playa, USA",region:"Nevada, USA",category:"LAND USE",coords:[40.79,-119.20],bounds:[[40.68,-119.42],[40.90,-118.98]],clue:"Find an enormous flat surface so uniform that even temporary marks stand out.",story:"The Black Rock Desert is one of the flattest large surfaces on Earth, so uniform that faint circular traces of temporary human activity remain visible for months.",hint:"Look for a vast pale flat basin with faint circular or linear marks."},
{id:"three-gorges",name:"Three Gorges Dam, China",region:"Hubei, China",category:"ENERGY",coords:[30.82,111.00],bounds:[[30.68,110.78],[30.96,111.22]],clue:"Find a landscape where a river has been dammed on a massive scale.",story:"The Three Gorges Dam backs the Yangtze into a long reservoir, with the dam's straight concrete wall and the surrounding terraced hills visible from orbit.",hint:"Look for a wide straight barrier across a river valley with a long reservoir behind it."},
{id:"okavango",name:"Okavango Delta, Botswana",region:"North-West District, Botswana",category:"NATURE",coords:[-19.28,22.90],bounds:[[-19.55,22.55],[-19.00,23.30]],clue:"Find a river delta that never reaches the sea.",story:"The Okavango River fans out into the Kalahari Desert, forming a lush inland delta of channels, islands and floodplains rather than draining to an ocean.",hint:"Look for a branching green fan of channels surrounded by dry desert."},

{id:"rotterdam",name:"Port of Rotterdam, Netherlands",region:"South Holland, Netherlands",category:"COAST",coords:[51.95,4.14],bounds:[[51.86,3.95],[52.04,4.35]],clue:"Find a coastline reorganized entirely around global shipping.",story:"Europe's largest port complex extends far into reclaimed land at the mouth of the Rhine, packed with container terminals, tank farms and shipping channels.",hint:"Look for a dense grid of docks, tanks and straight shipping channels along reclaimed coastline."},
{id:"sundarbans",name:"Sundarbans Mangrove Forest",region:"West Bengal, India / Bangladesh",category:"NATURE",coords:[21.95,89.18],bounds:[[21.75,88.90],[22.15,89.50]],clue:"Find a coastal forest laced with countless narrow tidal channels.",story:"The Sundarbans mangrove forest sits at the mouth of the Ganges, threaded by an intricate network of tidal creeks that shift with the seasons.",hint:"Look for dense green forest cut by thin, winding tidal channels."},
{id:"lena-delta",name:"Lena River Delta, Russia",region:"Sakha Republic, Russia",category:"WATER / NATURE",coords:[72.85,126.5],bounds:[[72.55,125.5],[73.15,127.5]],clue:"Find a frozen river delta fanning out toward the Arctic Ocean.",story:"The Lena Delta is one of the largest Arctic deltas, its channels frozen for much of the year and its permafrost polygons creating a distinct patterned ground.",hint:"Look for a huge branching delta with a mottled, patterned tundra surface."},

{id:"venice",name:"Venice Lagoon, Italy",region:"Veneto, Italy",category:"COAST",coords:[45.44,12.33],bounds:[[45.28,12.15],[45.58,12.55]],clue:"Find a historic city built entirely within a shallow lagoon.",story:"Venice sits on clusters of small islands within a shallow lagoon protected from the Adriatic by narrow barrier sandbars, with fish farms and channels nearby.",hint:"Look for a dense island city surrounded by a shallow lagoon and thin barrier islands."},
{id:"amazon-frontier",name:"Amazon Deforestation Frontier, Brazil",region:"Rondônia, Brazil",category:"LAND USE",coords:[-9.97,-63.0],bounds:[[-10.20,-63.35],[-9.75,-62.65]],clue:"Find a landscape where a forest is being replaced in a distinctive branching pattern.",story:"Deforestation along the Amazon's agricultural frontier often spreads outward from roads in a herringbone pattern, leaving a fishbone shape of cleared land.",hint:"Look for a fishbone or herringbone pattern of cleared land branching off straight roads."}

const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const dist=(a,b)=>{const R=6371,dLat=(b[0]-a[0])*Math.PI/180,dLon=(b[1]-a[1])*Math.PI/180,lat1=a[0]*Math.PI/180,lat2=b[0]*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.sin(dLon/2)**2*Math.cos(lat1)*Math.cos(lat2);return 2*R*Math.asin(Math.sqrt(x));};
function distanceToBoundsKm(point,bounds){
const lat=Math.max(bounds[0][0],Math.min(bounds[1][0],point[0]));
const lng=Math.max(bounds[0][1],Math.min(bounds[1][1],point[1]));
return dist(point,[lat,lng]);
}
function scoreForGuess(point,loc,modeId){
if(modeId==="city"){
const missKm=distanceToBoundsKm(point,loc.bounds);
return Math.max(0,Math.round(5000*Math.exp(-missKm/600)));
}
const km=dist(point,loc.coords);
const perfectRadius=modeId==="micro"?5:modeId==="airport"?10:15;
if(km<=perfectRadius)return 5000;
const falloff=modeId==="micro"?500:modeId==="airport"?800:1800;
return Math.max(0,Math.round(5000*Math.exp(-(km-perfectRadius)/falloff)));
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function pickGame(pool,modeId){
let seen=[];try{seen=JSON.parse(localStorage.getItem("terrain-seen")||"[]")}catch{seen=[]}
seen=seen.filter(id=>id.startsWith(modeId+":"));
let available=pool.filter(l=>!seen.includes(modeId+":"+l.id));
if(available.length<6){seen=[];available=pool.slice()}
const picks=shuffle(available).slice(0,6);
seen=seen.concat(picks.map(l=>l.id));
seen=seen.map(id=>id.startsWith(modeId+":")?id:modeId+":"+id);
try{localStorage.setItem("terrain-seen",JSON.stringify(seen))}catch{}
return picks;
}

let satTileErrors=0,satTileErrorEl=null,satLastMouseLatLng=null;
const CursorZoomControl=L.Control.extend({
options:{position:"topleft"},
onAdd:function(map){
const container=L.DomUtil.create("div","leaflet-control-zoom leaflet-bar leaflet-control");
const zoomInBtn=L.DomUtil.create("a","leaflet-control-zoom-in",container);
zoomInBtn.href="#";zoomInBtn.title="Zoom in";zoomInBtn.innerHTML="+";zoomInBtn.setAttribute("role","button");
const zoomOutBtn=L.DomUtil.create("a","leaflet-control-zoom-out",container);
zoomOutBtn.href="#";zoomOutBtn.title="Zoom out";zoomOutBtn.innerHTML="&#8722;";zoomOutBtn.setAttribute("role","button");
const doZoom=delta=>{
if(map._loaded===false)return;
const target=satLastMouseLatLng||map.getCenter();
const newZoom=map._limitZoom(map.getZoom()+delta);
map.setZoomAround(target,newZoom);
};
L.DomEvent.on(zoomInBtn,"click",L.DomEvent.stop).on(zoomInBtn,"click",()=>doZoom(1));
L.DomEvent.on(zoomOutBtn,"click",L.DomEvent.stop).on(zoomOutBtn,"click",()=>doZoom(-1));
const updateState=()=>{
zoomInBtn.classList.toggle("leaflet-disabled",map.getZoom()>=map.getMaxZoom());
zoomOutBtn.classList.toggle("leaflet-disabled",map.getZoom()<=map.getMinZoom());
};
map.on("zoomend zoomlevelschange",updateState);
updateState();
return container;
}
});
function setupSatellite(){
satMap=L.map("satellite",{zoomControl:false,attributionControl:true,worldCopyJump:false,zoomSnap:1,dragging:true});
new CursorZoomControl().addTo(satMap);
satMap.on("mousemove",e=>{
const t=e.originalEvent&&e.originalEvent.target;
if(t&&t.closest&&t.closest(".leaflet-control"))return;
satLastMouseLatLng=e.latlng;
});
satMap.on("mouseout",e=>{
const to=e.originalEvent&&e.originalEvent.relatedTarget;
if(to&&satMap.getContainer().contains(to))return;
satLastMouseLatLng=null;
});
const satTiles=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"© Esri, Maxar, Earthstar Geographics"}).addTo(satMap);
satTiles.on("tileerror",()=>{
satTileErrors++;
if(satTileErrors>=6&&!satTileErrorEl){
satTileErrorEl=document.createElement("div");
satTileErrorEl.style.cssText="position:absolute;z-index:1300;left:18px;top:18px;right:18px;background:rgba(120,20,15,.92);color:#f5ede9;padding:14px 18px;font-size:12px;letter-spacing:.04em;border:1px solid rgba(255,255,255,.25);";
satTileErrorEl.textContent="Satellite imagery isn't loading — check your internet connection or try refreshing.";
document.getElementById("stage").appendChild(satTileErrorEl);
}
});
satTiles.on("tileload",()=>{
if(satTileErrorEl){satTileErrorEl.remove();satTileErrorEl=null}
satTileErrors=0;
});
}
function setupGuessMap(){
guessMap=L.map("guessMap",{zoomControl:true,attributionControl:true,worldCopyJump:true,minZoom:2,maxZoom:19}).setView([20,0],2);
L.maplibreGL({style:"https://tiles.openfreemap.org/styles/positron"}).addTo(guessMap);
guessMap.on("click",e=>{if(!submitted){setGuess([e.latlng.lat,e.latlng.lng]);}});
}
let resizeTimer=null;
window.addEventListener("resize",()=>{
clearTimeout(resizeTimer);
resizeTimer=setTimeout(()=>{
if(satMap){
satMap.invalidateSize();
if(satBounds)fitSatelliteToBounds(satLocBounds);
}
if(guessMap)guessMap.invalidateSize();
},200);
});

function renderRound(){
const loc=game[round];guess=null;submitted=false;expanded=false;
document.getElementById("roundText").textContent=`${activeMode.name} · ROUND ${String(round+1).padStart(2,"0")} / 06`;
document.getElementById("scoreText").textContent=score.toLocaleString();
document.getElementById("clue").textContent="WHERE IN THE WORLD IS THIS?";
document.getElementById("category").textContent=activeMode.name;
document.getElementById("clueText").textContent="";
document.getElementById("clueText").hidden=true;
document.getElementById("revealClue").hidden=false;
document.getElementById("guessStatus").textContent="PLACE YOUR GUESS";
document.getElementById("guessPanel").classList.remove("expanded");
document.getElementById("toggleMap").textContent="EXPAND MAP ↗";
document.getElementById("result").innerHTML="";
document.getElementById("submit").disabled=true;document.getElementById("submit").classList.add("disabled");
satMap.eachLayer(l=>{if(l instanceof L.Marker||l instanceof L.Polyline){l.remove()}});
satMap.invalidateSize();
fitSatelliteToBounds(loc.bounds);
guessMap.setView([20,0],2);
if(guessMarker){guessMarker.remove();guessMarker=null}if(answerMarker){answerMarker.remove();answerMarker=null}if(line1){line1.remove();line1=null}if(line2){line2.remove();line2=null}
}
function fitSatelliteToBounds(bounds){
satMap.setMaxBounds(null);
satMap.setMinZoom(0);
satMap.setMaxZoom(17);
satMap.fitBounds(bounds,{padding:[10,10]});
const initialZoom=satMap.getZoom();
satMap.setMinZoom(initialZoom);
const visibleBounds=satMap.getBounds().pad(0.15);
satMap.setMaxBounds(visibleBounds);
satMap.options.maxBoundsViscosity=1;
satMap.setView(satMap.getCenter(),initialZoom);
satBounds=visibleBounds;
satLocBounds=bounds;
}

function setGuess(g){
guess=g;
if(guessMarker)guessMarker.remove();
guessMarker=L.marker(g,{icon:icon("guess","YOU")}).addTo(guessMap);
document.getElementById("guessStatus").textContent="PIN PLACED";
document.getElementById("submit").disabled=false;document.getElementById("submit").classList.remove("disabled");
}
function submitGuess(){
if(!guess||submitted)return;
submitted=true;const loc=game[round],km=dist(guess,loc.coords),pts=scoreForGuess(guess,loc,activeMode.id);score+=pts;
document.getElementById("scoreText").textContent=score.toLocaleString();document.getElementById("guessStatus").textContent="RESULT";
document.getElementById("submit").disabled=true;document.getElementById("submit").textContent="GUESS LOCKED";
if(answerMarker)answerMarker.remove();answerMarker=L.marker(loc.coords,{icon:icon("actual","ANSWER")}).addTo(guessMap);
if(line1)line1.remove();if(line2)line2.remove();
line1=L.polyline([guess,loc.coords],{color:"#0a0f0c",weight:10,opacity:.95}).addTo(guessMap);
line2=L.polyline([guess,loc.coords],{color:"#f5c542",weight:5,opacity:1,dashArray:"10 8"}).addTo(guessMap);
const group=L.latLngBounds([guess,loc.coords]);
expanded=true;document.getElementById("guessPanel").classList.add("expanded");document.getElementById("toggleMap").textContent="MINIMIZE MAP ↙";
setTimeout(()=>{
guessMap.invalidateSize();
if(km<=250){
const closeZoom=Math.min(14,guessMap.getBoundsZoom(group,false,[180,180]));
guessMap.setView(group.getCenter(),closeZoom,{animate:true});
}else{
guessMap.fitBounds(group,{padding:[90,90],maxZoom:5});
}
},300);
document.getElementById("result").innerHTML=`<div class="result-card"><div class="eyebrow">FIELD NOTE · ${esc(loc.category)}</div><h2>${esc(loc.name)}</h2><div class="result-stats"><div><span>DISTANCE TO CENTER</span><strong>${Math.round(km).toLocaleString()} km</strong></div><div><span>ROUND SCORE</span><strong>+${pts.toLocaleString()}</strong></div></div><p>${esc(loc.story)}</p><div class="hint-line"><b>What to notice:</b> ${esc(loc.hint)}</div>${round<5?'<button class="primary" id="nextBtn">NEXT ROUND →</button>':'<button class="primary" id="finishBtn">FINISH EXPEDITION →</button>'}</div>`;
if(round<5)document.getElementById("nextBtn").onclick=nextRound;else document.getElementById("finishBtn").onclick=showFinal;
}
function nextRound(){round++;renderRound();}
function showFinal(){
const total=score,list=safeLeaderboard();
if(window.goatcounter&&window.goatcounter.count){
window.goatcounter.count({path:"game-completed",title:"Game completed",event:true});

const drawRows=arr=>document.getElementById("rows").innerHTML=arr.slice(0,10).map((e,i)=>`<div class="leader-row"><span>${String(i+1).padStart(2,"0")} ${esc(e.name)}</span><strong>${Number(e.score).toLocaleString()}</strong></div>`).join("");
drawRows(list);
document.getElementById("saveBtn").onclick=()=>{const updated=saveLeaderboard(document.getElementById("nameInput").value,total);drawRows(updated)};
document.getElementById("againBtn").onclick=()=>startMode(activeMode.id);
